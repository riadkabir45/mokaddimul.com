---
- name: test connections
  become: true
  hosts: target_nodes
  remote_user: ansible

  tasks:
    - name: create gpg directory directory
      file:
        path: "/etc/apt/keyrings"
        state: directory
        owner: "root"
        group: "root"
        mode: '0755'

    - name: download  grafana gpg key
      get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        owner: root
        group: root
        mode: '0644'

    - name: create grafana repo file
      blockinfile:
        path: /etc/apt/sources.list.d/grafana.sources
        create: yes
        mode: '0755'
        block: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/grafana.asc

    - name: install grafana
      package:
        name: grafana
        state: latest
        update_cache: yes

    - name: enable and start grafana
      systemd:
        name: grafana-server
        enabled: yes
        state: started
